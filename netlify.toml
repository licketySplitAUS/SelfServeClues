[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Only the isolated experiment needs the imported archive in its server bundle.
[functions."history-*"]
  node_bundler = "esbuild"
  included_files = ["data/history/**"]

[[headers]]
  for = "/BabbleWordList.csv"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
