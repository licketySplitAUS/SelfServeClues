[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Only handlers that solve/read/recover history need the imported archive.
[functions."history-*"]
  node_bundler = "esbuild"

[functions."history-admin"]
  included_files = ["data/history/**"]
[functions."history-current"]
  included_files = ["data/history/**"]
[functions."history-process"]
  included_files = ["data/history/**"]
[functions."history-recovery"]
  included_files = ["data/history/**"]
[functions."history-unseen-words"]
  included_files = ["data/history/**"]

[[headers]]
  for = "/BabbleWordList.csv"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
